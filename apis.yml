aid: pinecone
name: Pinecone
description: With its vector database at the core, Pinecone is the leading knowledge
  platform for building accurate, secure, and scalable AI applications. The Pinecone
  APIs cover Database (vector storage and search), Inference (embeddings and reranking),
  Assistant (RAG over documents), and Admin (organization and project management).
